name: JARVIS CI

# V69 M61.2 — deterministic quality gates.
#
# Supersedes the previous main.yml, which had two defects that made it unfit as a
# release gate: `pip-audit ... || true` discarded the audit's exit code AND its
# visibility, and a `docker-build` job required a Docker daemon. Nothing here needs
# Ollama, a downloaded model, a microphone, TTS hardware, a Docker daemon, Redis,
# PostgreSQL, Zeek, Sysmon, Sliver, Metasploit, an API key, trusted-lab mode or
# administrator privileges. Tests that need a live service skip behind their marker.
#
# No mandatory gate uses `|| true` or `continue-on-error`. The single advisory job
# (dependency-audit) is explicitly labelled, documents why it is advisory, and still
# prints its full result — a silent pass is not an outcome this workflow can produce.
#
# V69 M61.7 — the Bandit gate moved out of `dependency-audit` into its own mandatory
# `security-scan` job, and its label now states the threshold it actually enforces
# (medium AND high, which is what `-ll` means). Previously a blocking gate lived inside
# an advisory-labelled job, and its label claimed high-only while 21 Medium findings
# were blocking. The command is unchanged; only the label and the job boundary are.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  JARVIS_ENV: test
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Host mutation is opt-in since M61.3; assert the default holds in CI too.
  JARVIS_AUTO_INSTALL_DEPS: "false"

# A new push to the same branch cancels the previous run: CI minutes are not a
# correctness signal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate 1: release truth. Cheapest gate, so it runs first and alone. ───────
  consistency:
    name: Release truth & dependency authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately NO dependency install: the consistency checker is pure stdlib,
      # so this gate cannot be broken by a resolution failure elsewhere.
      - name: Version, documentation and dependency consistency
        working-directory: jarvis
        run: python scripts/check_release_consistency.py

  # ── Gate 1b: the control plane, run DIRECTLY. BLOCKING. ────────────────────
  #
  # V69 S5G.1. This job exists because an independent red team measured its absence.
  # The control-plane verifier was reachable from CI only THROUGH pytest — a handful of
  # tests called it — and the authoritative command names both test trees, so a trailing
  # `tests/conftest.py` collection hook could deselect exactly those tests. Measured on the
  # S5G.1 branch: verifier FAIL with an ungoverned runtime module present, `pytest -q
  # jarvis/tests tests` exit 0 on the same tree. Nothing sequenced one before the other,
  # because the checker was not in this file at all.
  #
  # It runs as its own step, not as a test. A collection hook cannot deselect a step, and
  # this job installs nothing, so no dependency resolution can silence it either.
  #
  # FULL HISTORY is required for the same reason the deterministic suite needs it: the
  # verifier resolves `subject_state_commit`, requires HEAD to descend from it, and
  # compares the integration target against the declared authority. `check_git_authority`
  # FAILS CLOSED when master does not resolve, which on a depth-1 checkout is every run.
  control-plane:
    name: M62 control plane (verifier, authoritative)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Deliberately NO dependency install: the verifier is pure stdlib and treats an
      # absent `jsonschema` as "one opinion instead of two", which it reports.
      # Deliberately BEFORE the verifier, and deliberately not written in Python: this
      # step depends on no constant the checker owns. A commit that weakens the checker
      # can make the verifier say PASS about itself; it cannot make `git ls-files` stop
      # listing a file. The two collection hooks below are the only ones this repository
      # has, and a third is how F3/D52 masked 3 real failures into `exit 0`.
      #
      # No `|| true` anywhere: `test_no_mandatory_job_swallows_a_failure` forbids it in a
      # mandatory job, and it is right to. `case` does the allowlisting, and the file list
      # is materialised FIRST so a `git` failure is a step failure rather than an empty
      # loop that reports "only the allowlisted ones" having enumerated nothing.
      #
      # It covers every file pytest will read as configuration, not just conftests. A red
      # team took this whole gate green with a tracked ROOT `pyproject.toml` whose
      # `[tool.pytest.ini_options] addopts` `--ignore`d the two control-plane modules:
      # collection fell from 10,830 to 10,659, zero control-plane tests ran, and the suite
      # exited 0. A conftest-only guard never looked at it.
      - name: No ungoverned pytest collection or configuration surfaces
        run: |
          set -euo pipefail
          # REDIRECTED, not captured. `x=$(git ...)` makes git's exit status the
          # assignment's, which `set -e` does not act on -- so outside a repository the
          # loop ran zero times and the step reported "only the allowlisted ones" having
          # enumerated nothing at all. Measured. A redirect makes git the command.
          git ls-files \
            '*conftest.py' '*pyproject.toml' '*pytest.ini' '*tox.ini' '*setup.cfg' \
            > pytest-surfaces.txt
          ungoverned=""
          while read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              jarvis/conftest.py|jarvis/tests/conftest.py|jarvis/pyproject.toml) ;;
              *) ungoverned="$ungoverned $file" ;;
            esac
          done < pytest-surfaces.txt
          rm -f pytest-surfaces.txt
          if [ -n "$ungoverned" ]; then
            echo "::error::ungoverned pytest surface(s):$ungoverned"
            exit 1
          fi
          echo "pytest surfaces: jarvis/conftest.py, jarvis/tests/conftest.py, jarvis/pyproject.toml"
      - name: Verify the M62 control plane
        run: python jarvis/scripts/verify_m62_control_plane.py

  # ── Gate 2: lint + grammar on the authoritative interpreter. ────────────────
  lint:
    name: Ruff & compileall (3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            jarvis/requirements/*.txt
      - name: Install dev profile (constrained)
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt -r requirements/dev.txt
      - name: Ruff (correctness gate — E9 + full pyflakes)
        working-directory: jarvis
        run: ruff check .
      - name: compileall
        working-directory: jarvis
        run: python -m compileall -q core tools scripts aura main.py __main__.py

  # ── Gate 3: THE authoritative deterministic suite. ──────────────────────────
  # Runs the complete suite (jarvis/tests + the repo-level tests/) on the
  # authoritative interpreter. This is the job that must be green to merge.
  tests:
    name: Deterministic suite (3.11, authoritative)
    runs-on: ubuntu-latest
    env:
      RBAC_DEFAULT_ACTOR: "test-actor:Admin"
    steps:
      # V69 S5E — FULL HISTORY, and this is the only job that needs it.
      #
      # `actions/checkout@v4` defaults to `fetch-depth: 1`: one commit, no `master`
      # ref, no ancestry. This suite verifies the M62 control plane, which resolves
      # `subject_state_commit`, requires HEAD to descend from it, and compares `master`
      # against the declared invariant. `check_git_authority` FAILS CLOSED when master
      # does not resolve — correctly, because "the ref was not available" is not
      # evidence that master is untouched. On a depth-1 checkout that is unconditional,
      # so this job was red on every run for a reason no local suite could reproduce:
      # a developer clone always has history.
      #
      # Measured in S5E: `git clone --depth 1` of this branch yields 1 commit, no
      # `master`, no `origin/master`, and `git cat-file -e 0bb1a6b^{commit}` fails.
      # The other seven jobs touch no git and keep the cheap checkout — verified: the
      # compat job's four suites pass unchanged on a depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            jarvis/requirements/*.txt
      - name: Install dev + soc (drivers the suite imports)
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt \
            -r requirements/dev.txt -r requirements/soc.txt
      # Run from the REPOSITORY ROOT with both trees named explicitly. This is the
      # authoritative invocation (the one the release qualification and the M61
      # baseline use) and it is deliberately not `working-directory: jarvis`:
      # `tests/test_security.py::TestReadFile::test_relative_traversal_blocked`
      # resolves its `../../etc/passwd` fixture RELATIVE TO THE CWD, so the two
      # invocations exercise different paths and disagree. Naming the trees also
      # removes the dependency on pytest's rootdir/ini discovery.
      - name: Full deterministic suite (both trees)
        run: python -m pytest -q --tb=short jarvis/tests tests
      - name: Deterministic stabilization soak (M61.6.1)
        working-directory: jarvis
        run: python scripts/soak_stabilization_m61.py --json
      - name: Doctor (must not error a service-free environment)
        working-directory: jarvis
        run: python scripts/doctor.py

  # ── Gate 3b: the authoritative collection must still contain the gate. ─────
  #
  # V69 S5G.1 / D54. A red team took the whole suite green with a tracked ROOT
  # `pyproject.toml` whose `[tool.pytest.ini_options] addopts` `--ignore`d the two
  # control-plane modules: collection fell from 10,830 to 10,659, zero control-plane tests
  # ran, and `pytest -q jarvis/tests tests` exited 0. Its sibling check — the
  # ungoverned-surface allowlist — lives in `control-plane` because it is pure `git`.
  # This half has to ask pytest, so it needs the install.
  #
  # It is a SEPARATE JOB rather than a step in `tests` for a reason S5E pinned first:
  # `test_the_authoritative_command_names_both_trees` requires EXACTLY ONE pytest
  # invocation in the authoritative job, so that which command is authoritative is never
  # ambiguous. A second invocation there would have broken that guard, and the guard is
  # right.
  collection-integrity:
    name: Authoritative collection contains the control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            jarvis/requirements/*.txt
      - name: Install dev + soc (the suite must be importable to be collectable)
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt \
            -r requirements/dev.txt -r requirements/soc.txt
      # The AUTHORITATIVE argument list, not the two modules by name: `--ignore` does not
      # apply to a path given explicitly on the command line, so naming them collected 171
      # on exactly the tree this exists to catch. Measured.
      - name: The control-plane modules must survive authoritative collection
        run: |
          set -euo pipefail
          python -m pytest -q --collect-only --no-header jarvis/tests tests \
            > authoritative-collection.txt
          collected=$(grep -c 'test_control_plane_v4' authoritative-collection.txt)
          total=$(grep -c '::test_' authoritative-collection.txt)
          rm -f authoritative-collection.txt
          echo "authoritative collection: $total tests, $collected control-plane"
          if [ "$collected" -lt 150 ]; then
            echo "::error::only $collected control-plane tests survive collection (need 150+)"
            exit 1
          fi

  # ── Gate 4: compatibility. Lightweight — smoke, not the full suite. ─────────
  compat:
    name: Compatibility smoke (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            jarvis/requirements/*.txt
      - name: Install dev profile (constrained)
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements/constraints-ci.txt -r requirements/dev.txt
      - name: Consistency + grammar + M61 suites
        working-directory: jarvis
        run: |
          python scripts/check_release_consistency.py
          python -m compileall -q core tools scripts main.py
          python -m pytest -q tests/test_version_v69_m611.py \
            tests/test_dependency_authority_v69_m613.py \
            tests/test_packaging_v69_m615.py \
            tests/test_managed_logging_v69_m614.py

  # ── Gate 5: a base install must stay a BASE install. ────────────────────────
  # Proves the text-mode floor imports with only requirements/base.txt present —
  # no voice, no OCR, no SOC drivers, no lab/offensive tooling.
  base-install:
    name: Base text-mode install purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            jarvis/requirements/*.txt
      - name: Install ONLY the base profile
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
      - name: Base import surface must resolve
        working-directory: jarvis
        run: python scripts/check_base_import.py
      - name: Optional packages must be ABSENT (else this job proves nothing)
        working-directory: jarvis
        run: python scripts/check_base_import.py --assert-optional-absent

  # ── Gate 6: packaging. Build, then prove what is inside. ───────────────────
  packaging:
    name: Wheel & sdist build + manifest scan
    runs-on: ubuntu-latest
    needs: [consistency]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build wheel and sdist
        working-directory: jarvis
        run: python -m build --outdir "${RUNNER_TEMP}/dist"
      - name: Manifest & secret scan of the built artifacts
        working-directory: jarvis
        run: python scripts/check_package_manifest.py --dist "${RUNNER_TEMP}/dist"
      # Artifacts are NOT uploaded. A build artifact from this repository could
      # carry runtime state; the manifest scan above is the evidence, and it runs
      # in-job where its failure is a gate rather than a download.

  # ── Gate 7: static security analysis. BLOCKING. ─────────────────────────────
  #
  # V69 M61.7 — this used to be a step inside `dependency-audit`, a job named
  # "Dependency audit (advisory)". Two things were untrue about that:
  #
  #   1. The step was labelled "Bandit (high severity — blocking)" while the
  #      command it ran, `-ll`, reports MEDIUM *and* HIGH. The label understated
  #      the gate: 21 Medium findings were blocking merges while the workflow
  #      claimed only High did. The command is unchanged and the label is now
  #      accurate — the threshold was NOT lowered to match the old label.
  #   2. A blocking gate lived inside an advisory-labelled job, so anyone reading
  #      the job list saw "advisory" and inferred nothing there could block.
  #
  # It is now its own mandatory job. That also fixes a real sequencing defect: as
  # a step, a Bandit failure skipped the pip-audit step that followed it, so a
  # security regression silently cost the dependency audit too. Separate jobs run
  # independently, so both results are always produced.
  #
  # No `|| true`, no `continue-on-error`, no captured-and-discarded exit status:
  # the command's own exit code is the job's verdict.
  security-scan:
    name: Static security analysis (medium/high — blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      # `-ll` == report MEDIUM and above. Both are blocking; see the M61.7 triage
      # in docs/V69_M61_PRODUCTION_STABILIZATION.md for every finding's disposition.
      # Bandit's own `-q` output already enumerates every blocking finding in this
      # step's log, so there is deliberately NO second "inventory" step here. A
      # summary step would have to tolerate Bandit's non-zero exit to run after it,
      # and a failure-swallowing command inside a MANDATORY job is exactly what the
      # M61.2 workflow invariants forbid. The machine-readable inventory (with the
      # non-vacuity and suppression-growth checks) lives in the release
      # qualification instead: tests/test_bandit_gate_v69_m617.py.
      - name: Bandit (medium/high severity — blocking)
        working-directory: jarvis
        run: bandit -r core tools -ll -q

  # ── Advisory: dependency vulnerability audit. NON-BLOCKING, and here is why. ─
  # pip-audit resolves against live advisory feeds, so a new CVE published against
  # a transitive dependency turns an unchanged, correct commit red with no code
  # change to make. That is a maintenance signal, not a correctness gate, so it
  # does not block merges. It is NOT silenced: `continue-on-error` keeps the step's
  # real exit status and full output visible in the run summary, unlike the
  # `|| true` this replaces, which discarded the result entirely.
  #
  # Deliberately has no `needs:` — it must report even when security-scan is red.
  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner
        run: python -m pip install --upgrade pip pip-audit
      - name: pip-audit (advisory, result visible)
        id: pip_audit
        continue-on-error: true
        working-directory: jarvis
        run: pip-audit -r requirements/base.txt
      - name: Report the advisory outcome
        if: always()
        run: |
          echo "pip-audit outcome: ${{ steps.pip_audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
