version: "3.9"

services:
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://jarvis:jarvis@postgres:5432/jarvis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SIEM_ENDPOINT: ${SIEM_ENDPOINT:-}
      SIEM_API_KEY: ${SIEM_API_KEY:-}
      RBAC_DEFAULT_ACTOR: ${RBAC_DEFAULT_ACTOR:-analyst@local:Analyst}
      JARVIS_ENV: ${JARVIS_ENV:-production}
    ports:
      - "8765:8765"
    # V69 M68B (E) — persistence is classified, not blanket.
    #   /app/data  DURABLE_SECURITY_STATE. Holds the M65C/M65D durable effect
    #              journal (data/effect_journal.db). The retry authority reads it
    #              to decide whether an effect already happened, so losing it on
    #              `up --force-recreate` REPLAYS effects that already ran.
    #   /app/logs  AUDIT_EVIDENCE. The append-only tactic/shutdown audit trail.
    # Deliberately NOT persisted: per-execution containment workspaces under
    # /tmp (core.containment proves it deleted them — a volume would resurrect
    # attacker-controlled files), bytecode, and .env (a secret in a named volume
    # outlives every `docker compose down` an operator would expect to clear it;
    # it arrives through env_file instead).
    # This buys survival of CONTAINER RECREATION. It is NOT a crash-durability
    # claim: no Compose configuration can make one.
    # Ownership: the image creates /app/data and /app/logs and chowns them to the
    # non-root `jarvis` user before USER jarvis, so a fresh named volume inherits
    # a writable root. See core/deployment_persistence.py for the classification.
    volumes:
      - jarvis_data:/app/data
      - jarvis_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarvis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis}
      POSTGRES_DB: ${POSTGRES_DB:-jarvis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  jarvis_data:
  jarvis_logs:
