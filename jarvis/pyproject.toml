[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
# V69 M61.1 — the version is DYNAMIC and derives from core/version.py, the single
# canonical source. Never hand-edit a version string here: the consistency test
# (tests/test_version_v69_m611.py) fails the build if this stops deriving.
dynamic = ["version"]
description = "Local-first, operator-controlled AI workstation and authorized Purple Team/SOC homelab platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Alejandro" }]
keywords = ["ollama", "local-llm", "soc", "dfir", "voice-assistant", "security"]

# ── DEPENDENCY AUTHORITY (V69 M61.3) ─────────────────────────────────────────
# requirements/*.txt are the DECLARED AUTHORITY. The lists below are DERIVED from
# them and verified byte-for-byte by core.dependency_authority.audit(), which runs
# as a mandatory CI gate and as tests/test_dependency_authority_v69_m613.py.
# Add or change a dependency in requirements/<profile>.txt FIRST, then mirror it
# here; the drift checker fails the build otherwise.
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "duckduckgo-search>=6.0",
    "dnspython>=2.6.0",
    "python-whois>=0.9.0",
    "psutil>=5.9.8",
    "schedule>=1.2.0",
    "PyYAML>=6.0.1",
    "aiohttp>=3.9.3",
    "aiofiles>=23.2.1",
    "aiosqlite>=0.20.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Mirrors of requirements/<name>.txt (minus the shared `-r base.txt` include).
voice = ["sounddevice>=0.4.6", "soundfile>=0.12.1", "numpy>=1.24.0", "faster-whisper>=1.0.0", "pyttsx3>=2.90", "webrtcvad>=2.0.10", "pyaudio>=0.2.14"]
docs = ["pdfplumber>=0.10.0", "python-docx>=1.1.0", "openpyxl>=3.1.0", "pandas>=2.0.0", "python-pptx>=0.6.23", "Pillow>=10.0.0", "pytesseract>=0.3.10", "easyocr>=1.7.1", "striprtf>=0.0.26", "markdown>=3.5.0"]
soc = ["defusedxml>=0.7.1", "yara-python>=4.5.0","scapy>=2.5.0", "paramiko>=3.4.0", "pefile>=2023.2.7", "capstone>=5.0.1", "stix2>=3.0.0", "scipy>=1.12.0", "mmh3>=4.1.0", "feedparser>=6.0.12", "ntplib>=0.4.0", "piexif>=1.1.3", "cryptography>=42.0.0", "watchdog>=4.0.0", "networkx>=3.2.0", "ijson>=3.2.3", "igraph>=0.11.0", "pyserial>=3.5", "pyserial-asyncio>=0.6", "asyncssh>=2.14.0", "netmiko>=4.3.0", "asyncpg>=0.29.0", "redis>=5.0.0"]
# LAB-ONLY, offensive-capable and GUI-automation tooling. Deliberately NOT part of
# the base install: `pip install jarvis` must never pull mitmproxy, Metasploit RPC,
# Sliver, global-hotkey `keyboard` or GUI automation onto a workstation.
lab = ["docker>=7.0.0", "opencv-python>=4.9.0", "mitmproxy>=10.3.0", "pymetasploit3>=1.0.3", "grpcio>=1.62.0", "grpcio-tools>=1.62.0", "sliver-py>=0.0.19", "playwright>=1.40.0", "shodan>=1.31.0", "gitpython>=3.1.40", "nvdlib>=0.7.5", "qrcode>=7.4.2", "mss>=9.0.1", "pyautogui>=0.9.54", "pygetwindow>=0.0.9", "keyboard>=0.13.5", "pyperclip>=1.8.2", "python-telegram-bot>=20.7"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.4.0", "bandit>=1.7.0", "pip-audit>=2.7.0"]
# The full workstation. Mirrors requirements/all.txt: the union of every profile
# plus the AURA UI, the RAG stack and the rendering/telemetry extras.
all = [
    "jarvis[voice,docs,soc,lab,dev]",
    "fastapi>=0.111.0", "uvicorn[standard]>=0.29.0", "websockets>=12.0",
    "chromadb>=0.5.0", "sentence-transformers>=3.0.0",
    "torch-directml>=0.1.0", "trimesh>=4.0.0", "schemdraw>=0.15", "matplotlib>=3.8.0",
    "pywintrace>=0.2.0 ; platform_system == 'Windows'",
]

[project.scripts]
jarvis = "main:main"

# ── Packaging (V69 M61.5) ────────────────────────────────────────────────────
# The app uses a FLAT layout, so setuptools auto-discovery cannot infer it (it sees
# several top-level packages and refuses). Declare it explicitly instead. Runtime
# state (`data/`, `logs/`), the test suites, `conftest.py` and the security key
# files are excluded here and pruned again in MANIFEST.in for the sdist.
[tool.setuptools]
packages = ["core", "tools", "aura"]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "core.version.VERSION" }

[tool.setuptools.package-data]
# Declarative rule/config assets the modules load at runtime. Explicit allowlist:
# anything not named here does not ship.
core = ["*.yaml", "playbooks/*.yaml", "playbooks/*.yml", "sigma_rules/*.yml", "signatures/*.yar"]
aura = ["templates/*.html", "static/*"]

[tool.setuptools.exclude-package-data]
# Belt and braces: these are gitignored security/state files that exist in a
# developer working tree and must NEVER be built into a distribution.
core = ["telemetry_keys.json", "trust_profile.json", "feed_hashes.json", "integrity_baseline.json"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Gate: syntax errors (E9) + the full pyflakes ruleset (F) — real correctness
# issues (unused imports/vars, undefined names, bad f-strings, redefinitions).
# CI fails on these (no `|| true`). The broader pycodestyle style set (E/W,
# excluding E501) is a separate cleanup tracked in CHANGELOG.md.
select = ["E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Code-generation template: __JARVIS_PORT__ is string-substituted at runtime by
# sensor_mesh._generate_agent_script, so it is intentionally undefined here.
"**/sensor_agent_template.py" = ["F821"]
# Self-test probes import optional deps purely to confirm availability
# (`try: import yara` → report present/absent). The bound name is intentionally
# unused; removing the import would make every probe report success. F401 here
# is a proven false positive for that pattern.
"**/self_test.py" = ["F401"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = [".", "brain/docs/intrusion-detection-system"]
# Both test trees run by default: the app suite (jarvis/tests) and the
# repo-level suite (../tests), which holds the FORCE_OVERRIDE + SSRF executor
# hardening regression tests (test_security_hardening.py). The repo-level suite
# was previously not collected, so those security guardrail tests never ran in
# the default `pytest` invocation.
testpaths = ["tests", "../tests"]
markers = [
    "slow: long-running tests",
    "windows: requires a Windows host",
    "integration: exercises multiple subsystems together",
    "requires_audio: needs a microphone / audio backend",
    "requires_ollama: needs a running Ollama server",
    "requires_docker: needs a Docker daemon",
    "requires_redis: needs a Redis server",
    "requires_postgres: needs a PostgreSQL server",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
